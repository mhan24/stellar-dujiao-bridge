[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-dujiao-bridge"
version = "1.0.0"
description = "Stellar Wholesale eSIM bridge that speaks the Dujiao-Next upstream protocol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<1",
    "mypy>=1.11,<3",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv*", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",   # long lines are formatted by hand in SQL and log messages
    "B008",   # FastAPI dependencies intentionally use call defaults
    "SIM105", # try/except/pass reads better than contextlib.suppress here
    # Cosmetic only: timezone.utc / asyncio.TimeoutError read the same on 3.12
    # and keep the code importable on older interpreter used for dev.
    "UP017",
    "UP041",
]

[tool.ruff.lint.per-file-ignores]
# Nested `with` blocks in tests mirror the call structure under test.
"tests/*" = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
